name: Scrape car auctions

on:
  schedule:
    # Hourly, 10:17-23:17 Tbilisi (UTC+4, no DST) = 06:17-19:17 UTC.
    # Off the :00 mark: GitHub delays/drops scheduled runs at the top of the hour.
    - cron: "17 6-19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape-car-auctions
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scraper.py
        env:
          PARSE_API_KEYS: ${{ secrets.PARSE_API_KEYS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Persist seen lots
        run: |
          git config user.name "car-finder-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen.db
          git diff --cached --quiet || git commit -m "Update seen lots"
          git push
